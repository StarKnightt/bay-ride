<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bay Ride</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #efe6d2; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 22px; top: 18px;
        font: 400 13px/1 Georgia, "Times New Roman", serif; letter-spacing: 0.12em;
        color: rgba(255, 252, 240, 0.85); text-shadow: 0 1px 3px rgba(40, 30, 20, 0.45);
        pointer-events: none; user-select: none;
      }
      #fade { position: fixed; inset: 0; background: #efe6d2; pointer-events: none; }
      #loader {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #efe6d2; color: #5b5144; font-family: Georgia, "Times New Roman", serif;
        transition: opacity 0.8s ease; z-index: 5;
      }
      #loader h1 { font-weight: 400; font-size: 34px; letter-spacing: 0.3em; margin: 0 0 22px 0.3em; }
      #loader .bar { width: 220px; height: 1px; background: rgba(91, 81, 68, 0.2); overflow: hidden; }
      #loader .bar i { display: block; height: 100%; background: #5b5144; transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease; }
      #loader .line { margin-top: 16px; font-size: 12px; letter-spacing: 0.25em; opacity: 0.7; min-height: 1em; }
      #loader.ready .line { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }
      #loader.gone { opacity: 0; pointer-events: none; }
      #loader.quiet { display: none; }
      @keyframes breathe { 50% { opacity: 0.45; } }
      .tod { position: fixed; right: 18px; top: 16px; display: flex; gap: 6px; z-index: 2; }
      .tod button {
        font: 400 12px/1 Georgia, "Times New Roman", serif; letter-spacing: 0.08em;
        padding: 7px 11px; border-radius: 14px; cursor: pointer;
        color: rgba(255, 252, 240, 0.92); background: rgba(40, 34, 30, 0.28);
        border: 1px solid rgba(255, 252, 240, 0.35); backdrop-filter: blur(3px);
        text-shadow: 0 1px 2px rgba(40, 30, 20, 0.4); transition: background 0.3s ease;
      }
      .tod button:hover { background: rgba(40, 34, 30, 0.42); }
      .tod button.on { background: rgba(255, 246, 225, 0.85); color: #4d4337; text-shadow: none; }
      .keys {
        position: fixed; left: 22px; bottom: 18px; font: 400 12px/1.7 Georgia, "Times New Roman", serif;
        color: rgba(255, 252, 240, 0.85); text-shadow: 0 1px 3px rgba(40, 30, 20, 0.5);
        pointer-events: none; user-select: none; transition: opacity 1.2s ease;
      }
      .keys b { font-weight: 400; color: #fff; }
      .keys.off { opacity: 0; }
      .fatal { max-width: 460px; margin: 18vh auto; font-family: Georgia, serif; color: #4d4337; text-align: center; }
      .fatal button { font: inherit; padding: 6px 16px; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="fade"></div>
    <div id="loader">
      <h1>Bay Ride</h1>
      <div class="bar"><i></i></div>
      <div class="line"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
