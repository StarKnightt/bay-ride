<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bay Ride</title>
    <meta name="description" content="Walk the pier and the beach of a painted seaside bay, then take the little motorboat out on the water, from early morning to moonlit night." />
    <meta name="theme-color" content="#168fb0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='k' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23168fb0'/%3E%3Cstop offset='1' stop-color='%23a8dade'/%3E%3C/linearGradient%3E%3CclipPath id='r'%3E%3Crect width='64' height='64' rx='14'/%3E%3C/clipPath%3E%3C/defs%3E%3Cg clip-path='url(%23r)'%3E%3Crect width='64' height='43' fill='url(%23k)'/%3E%3Ccircle cx='46' cy='20' r='8' fill='%23fff2cc'/%3E%3Cpath d='M6 43c4-6 10-9 17-9s13 3 17 9z' fill='%235d8ea2'/%3E%3Cpath d='M20 35l1.4-16h5.2l1.4 16z' fill='%23f4f0e6'/%3E%3Cpath d='M20.9 25h6.2l.3 3.5h-6.8zM21 19h6l-3-4z' fill='%23c8473a'/%3E%3Crect y='42' width='64' height='22' fill='%2325789a'/%3E%3Cpath d='M4 51q5-3 10 0t10 0t10 0t10 0t10 0t10 0' fill='none' stroke='%23dff3f1' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M41 46h10M43 57h6' stroke='%23fff2cc' stroke-width='2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // Before first paint: the loader's backdrop in the opening time of day's sky and sea (the
      // painted intro's own gradients), by the same URL rules as bootPreset, so no cream frame.
      (function () {
        var P = {
          morning: ["#2b98ad", "#5bb5c6", "#b6d8d6", "#f3dfc9", "#9ccac8", "#4f9db0", "#2f7c9c", "#24688a"],
          noon: ["#168fb0", "#36a9c6", "#9fd6dc", "#dcefe6", "#7cbcc6", "#3f97ad", "#25789a", "#1d6588"],
          golden: ["#3f7a8e", "#b3a684", "#ebc78c", "#f6d49a", "#e2c18c", "#8f9a86", "#3a6a80", "#28506a"],
          sunset: ["#2c5078", "#9c7f9c", "#e9a58c", "#ffb878", "#e8a07a", "#8a7896", "#3a4c78", "#25335a"],
          dusk: ["#141a46", "#34467a", "#8a6e88", "#dd8e6c", "#8a7a9a", "#4e5a92", "#2c3466", "#1a2048"],
          night: ["#071131", "#122452", "#22386a", "#33497e", "#2c4470", "#1a3058", "#10224a", "#0a1838"]
        };
        var q = new URLSearchParams(location.search);
        var k = (q.get("tod") || q.get("time") || "").toLowerCase().replace(/[^a-z]/g, "");
        if (k === "goldenhour") k = "golden";
        if (q.get("timelapse") === "1") k = "morning";
        var c = P[k] || P.golden, H = 63;
        var g = "linear-gradient(to bottom, " + c[0] + " 0%, " + c[1] + " " + H * 0.45 + "%, " + c[2] + " " + H * 0.82 + "%, " + c[3] + " " + H + "%, " +
          c[4] + " " + H + "%, " + c[5] + " " + (H + 37 * 0.3) + "%, " + c[6] + " " + (H + 37 * 0.65) + "%, " + c[7] + " 100%)";
        var r = document.documentElement.style;
        r.setProperty("--boot", g);
        r.setProperty("--boot-c", c[7]);
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--boot-c, #efe6d2); }
      canvas { display: block; }
      #fade { position: fixed; inset: 0; background: var(--boot, #efe6d2); pointer-events: none; }
      #loader {
        position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center;
        background: var(--boot, #efe6d2); transition: opacity 0.9s ease; z-index: 5; cursor: pointer;
      }
      #loader .bar { width: 160px; height: 1px; margin-bottom: 9vh; background: rgba(91, 81, 68, 0.18); overflow: hidden; transition: width 1.6s ease, background 1.6s ease; }
      #loader .bar i { display: block; height: 100%; background: #5b5144; transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease, background 1.6s ease; }
      #loader.ready { background: transparent; }
      #loader.ready .bar { width: 44px; background: transparent; animation: breathe 2.8s ease-in-out infinite; }
      #loader.ready .bar i { background: rgba(255, 252, 244, 0.9); box-shadow: 0 0 6px rgba(255, 250, 235, 0.8); }
      #loader.gone { opacity: 0; pointer-events: none; }
      #loader.quiet { display: none; }
      #loader .title { position: absolute; left: 0; right: 0; top: 9vh; text-align: center; z-index: 1; pointer-events: none; color: #fffaf0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; text-shadow: 0 2px 18px rgba(40, 28, 20, 0.35), 0 1px 2px rgba(40, 28, 20, 0.3); }
      #loader .title::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(70vw, 900px); height: 30vh; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(40, 26, 18, 0.22), rgba(40, 26, 18, 0)); z-index: -1; }
      #loader .title h1 { margin: 0; font-weight: 400; font-style: italic; font-size: clamp(44px, 8.4vw, 118px); letter-spacing: 0.02em; line-height: 1; }
      #loader .title p { margin: 1.4vh 0 0; font-size: clamp(11px, 0.95vw, 17px); text-shadow: 0 1px 3px rgba(40, 26, 18, 0.55), 0 0 12px rgba(40, 26, 18, 0.35); letter-spacing: 0.42em; text-transform: uppercase; opacity: 0.86; }
      #loader .title .rule { display: block; width: 64px; height: 1px; margin: 2.2vh auto 0; background: rgba(255, 250, 240, 0.7); }
      #loader .keys { position: absolute; left: 50%; bottom: 13vh; transform: translateX(-50%); z-index: 1; pointer-events: none;
        display: grid; grid-template-columns: repeat(3, auto); gap: 6px 34px; padding: 16px 26px 14px; border-radius: 14px;
        font: 400 clamp(12px, 0.82vw, 16px)/1.55 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; color: rgba(255, 251, 242, 0.94);
        background: rgba(30, 26, 26, 0.26); backdrop-filter: blur(6px); box-shadow: 0 8px 30px rgba(20, 14, 10, 0.18); text-shadow: 0 1px 2px rgba(20, 14, 10, 0.35); }
      #loader .keys h2 { margin: 0 0 3px; font-family: inherit; font-style: italic; font-weight: 400; font-size: 1.04em; line-height: 1.4; letter-spacing: 0.06em; opacity: 0.75; }
      #loader .keys div { white-space: nowrap; }
      #loader .keys kbd { display: inline-block; min-width: 14px; margin-right: 7px; padding: 0 5px; border: 1px solid rgba(255, 250, 238, 0.5); border-radius: 4px;
        font: 400 0.86em/1.45 Georgia, serif; text-align: center; color: #fffaf0; background: rgba(255, 250, 238, 0.08); }
      #loader .start { position: absolute; left: 0; right: 0; bottom: calc(9vh + 12px); text-align: center; z-index: 1; pointer-events: none;
        font: italic 400 clamp(13px, 0.95vw, 18px)/1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: 0.18em; color: rgba(255, 252, 244, 0.95);
        text-shadow: 0 1px 3px rgba(20, 14, 10, 0.45); opacity: 0; transition: opacity 1.2s ease 0.6s; }
      #loader.ready .start { opacity: 1; animation: breathe 2.8s ease-in-out 1.8s infinite; }
      #loader .note { position: absolute; left: 0; right: 0; bottom: calc(9vh + 12px); text-align: center; z-index: 1; pointer-events: none; margin: 0;
        font: italic 400 clamp(11px, 0.85vw, 15px)/1.3 "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; letter-spacing: 0.12em;
        color: #fffaf0; opacity: 0.78; text-shadow: 0 1px 3px rgba(40, 26, 18, 0.55), 0 0 12px rgba(40, 26, 18, 0.35); transition: opacity 0.6s ease; }
      #loader.ready .note { opacity: 0; }
      @media (max-height: 560px) { #loader .keys { display: none; } }
      @keyframes breathe { 50% { opacity: 0.35; } }
      .help {
        position: fixed; left: 22px; bottom: 20px; padding: 12px 16px; border-radius: 10px;
        font: 400 12px/1.75 Georgia, "Times New Roman", serif; color: rgba(255, 252, 240, 0.9);
        background: rgba(36, 32, 30, 0.34); backdrop-filter: blur(4px); text-shadow: 0 1px 2px rgba(30, 24, 20, 0.5);
        pointer-events: none; user-select: none; opacity: 0; transition: opacity 0.5s ease;
      }
      .help b { display: inline-block; min-width: 92px; font-weight: 400; color: #fff; }
      .help.on { opacity: 1; }
      .fatal { max-width: 460px; margin: 18vh auto; font-family: Georgia, serif; color: #4d4337; text-align: center; }
      .fatal button { font: inherit; padding: 6px 16px; }
    </style>
  </head>
  <body>
    <div id="fade"></div>
    <div id="loader">
      <div class="title"><h1>Bay Ride</h1><span class="rule"></span><p>a painted seaside</p></div>
      <div class="keys">
        <div><h2>On foot</h2><div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>walk</div><div><kbd>Shift</kbd>run</div><div><kbd>Space</kbd>jump</div></div>
        <div><h2>In the boat</h2><div><kbd>F</kbd>board / leave</div><div><kbd>W</kbd><kbd>S</kbd>throttle</div><div><kbd>A</kbd><kbd>D</kbd>steer &middot; <kbd>Shift</kbd>boost</div></div>
        <div><h2>Anytime</h2><div><kbd>C</kbd>camera &middot; <kbd>T</kbd>time of day</div><div><kbd>M</kbd>music</div><div><kbd>H</kbd>help</div></div>
      </div>
      <p class="note">the first visit takes up to a minute while the sea is painted &middot; instant after that</p>
      <div class="start">click to start</div>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
